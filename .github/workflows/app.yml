name: App

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/FastCopy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FastCopy-android
          path: app/build/FastCopy.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: sign it when installing (e.g. Sideloadly / AltStore with your Apple ID).
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../FastCopy-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FastCopy-ios-unsigned
          path: app/build/FastCopy-unsigned.ipa
